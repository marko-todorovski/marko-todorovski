# Application Name
spring.application.name=AI Diagram Generator

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_diagrams
spring.datasource.username=ai_user
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.aidiagramgenerator=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# API Documentation (Swagger/OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# Server Configuration
server.port=8080
server.error.include-message=always

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-binding-errors=always

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# AI Provider Configuration (openai or ollama)
ai.provider=openai

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:your-api-key-here}
openai.api.url=https://api.openai.com/v1/chat/completions
# Classification (fast + cheap)
openai.model=gpt-4o-mini
# Diagram generation (better quality)
openai.diagram.model=gpt-4o

# Ollama Configuration (local AI)
ollama.api.url=http://localhost:11434/api/generate
ollama.model=llama3

# OpenAI Diagram Service Configuration
openai.diagram.enabled=true
openai.diagram.fallback.enabled=true
diagram.generation.timeout-seconds=30

# Diagram Classification Thresholds
diagram.classification.high=70
diagram.classification.medium=40

# Evaluation Dataset
diagram.evaluation.dataset=classpath:evaluation-dataset.json
diagram.generation-evaluation.dataset=classpath:generation-evaluation-dataset.json
