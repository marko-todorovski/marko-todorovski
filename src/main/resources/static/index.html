<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Diagram Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="/css/app.css?v=9">
    <link rel="stylesheet" href="/css/auth.css?v=9">
    <link rel="stylesheet" href="/css/workspace.css?v=9">
    <link rel="stylesheet" href="/css/editor.css?v=9">
    <link rel="stylesheet" href="/css/responsive.css?v=9">
</head>
<body>
    <div id="root"></div>
    <div id="startup-error" class="startup-error" hidden>
        The workspace interface could not start. Refresh the page and try again.
    </div>

    <!-- Babel loads these browser modules in dependency order; each registers under window.AiDiagramApp. -->
    <script>
        window.AiDiagramApp = window.AiDiagramApp || {};
        window.AiDiagramApp.modules = window.AiDiagramApp.modules || {};

        const frontendScripts = [
            "/js/api.jsx?v=9",
            "/js/shared.jsx?v=9",
            "/js/routing.jsx?v=9",
            "/js/auth.jsx?v=9",
            "/js/projects.jsx?v=9",
            "/js/ai-assistant.jsx?v=10",
            "/js/sharing.jsx?v=11",
            "/js/collaboration.jsx?v=12",
            "/js/repositories.jsx?v=1",
            "/js/editor.jsx?v=9",
            "/js/generator.jsx?v=9",
            "/js/app.jsx?v=13"
        ];

        function showStartupError(error) {
            console.error(error);
            const startupError = document.getElementById("startup-error");
            if (startupError) startupError.hidden = false;
        }

        async function loadFrontendScripts() {
            for (const sourceUrl of frontendScripts) {
                const response = await fetch(sourceUrl, { credentials: "same-origin" });
                if (!response.ok) throw new Error(`Could not load ${sourceUrl}`);
                const source = await response.text();
                const compiled = Babel.transform(source, {
                    presets: ["env"],
                    plugins: [["transform-react-jsx", { runtime: "classic" }]],
                    sourceType: "script"
                }).code;
                const script = document.createElement("script");
                script.text = `${compiled}\n//# sourceURL=${sourceUrl}`;
                document.body.appendChild(script);
            }
        }

        loadFrontendScripts().catch(showStartupError);
    </script>
</body>
</html>
