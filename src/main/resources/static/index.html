<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Diagram Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .app { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
        h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
        .form { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
        .row { display: flex; gap: 1rem; align-items: flex-end; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.35rem; }
        textarea { width: 100%; height: 120px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 0.75rem; font-size: 0.9rem; resize: vertical; font-family: inherit; }
        textarea:focus { outline: none; border-color: #3b82f6; }
        select { background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 0.6rem 0.75rem; font-size: 0.9rem; min-width: 180px; cursor: pointer; }
        select:focus { outline: none; border-color: #3b82f6; }
        button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        button:hover:not(:disabled) { background: #2563eb; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result { background: #1e293b; border-radius: 12px; padding: 1.5rem; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .result-header h2 { font-size: 1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge { background: #334155; color: #94a3b8; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; }
        .diagram-container { background: #fff; border-radius: 8px; padding: 1.5rem; min-height: 100px; display: flex; align-items: center; justify-content: center; overflow: auto; }
        .diagram-container svg { max-width: 100%; height: auto; }
        .diagram-container img { max-width: 100%; height: auto; }
        .explanation { margin-top: 1rem; font-size: 0.85rem; color: #64748b; line-height: 1.5; }
        .error { background: #7f1d1d33; border: 1px solid #991b1b; border-radius: 8px; padding: 0.75rem 1rem; color: #fca5a5; font-size: 0.85rem; margin-bottom: 1rem; }
        .code-block { margin-top: 1rem; }
        .code-block-label { font-size: 0.72rem; color: #475569; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.4rem; }
        .code-block pre { background: #0f172a; border-radius: 6px; padding: 1rem; font-size: 0.8rem; overflow-x: auto; color: #94a3b8; font-family: 'SF Mono', Monaco, monospace; margin: 0; }
        .render-error { background: #1c1010; border: 1px solid #7f1d1d; border-radius: 8px; padding: 0.75rem 1rem; color: #fca5a5; font-size: 0.82rem; margin-bottom: 0.75rem; line-height: 1.5; }
        .render-error strong { color: #f87171; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .links { margin-top: 2rem; text-align: center; }
        .links a { color: #3b82f6; text-decoration: none; font-size: 0.85rem; margin: 0 0.75rem; }
        .links a:hover { text-decoration: underline; }
        .suggestion { background: #1e3a5f; border: 1px solid #3b82f6; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
        .suggestion-header { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #60a5fa; margin-bottom: 0.6rem; }
        .suggestion-message { color: #93c5fd; font-size: 0.9rem; margin-bottom: 0.75rem; line-height: 1.5; }
        .suggestion-meta { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
        .suggestion-type { background: #3b82f6; color: #fff; font-size: 0.75rem; padding: 0.25rem 0.7rem; border-radius: 4px; font-weight: 700; letter-spacing: 0.03em; }
        .suggestion-confidence { color: #94a3b8; font-size: 0.75rem; }
        .suggestion-conf-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.85rem; }
        .suggestion-conf-track { flex: 1; height: 6px; background: #1e3a5f; border: 1px solid #334155; border-radius: 3px; overflow: hidden; }
        .suggestion-conf-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
        .suggestion-conf-fill.high { background: #22c55e; }
        .suggestion-conf-fill.med  { background: #f59e0b; }
        .suggestion-conf-fill.low  { background: #ef4444; }
        .suggestion-conf-label { font-size: 0.72rem; color: #94a3b8; min-width: 2.8rem; text-align: right; }
        .suggestion-actions { display: flex; gap: 0.75rem; }
        .btn-proceed { background: #22c55e; }
        .btn-proceed:hover:not(:disabled) { background: #16a34a; }
        .btn-dismiss { background: #475569; }
        .btn-dismiss:hover:not(:disabled) { background: #64748b; }
        .error-reject { background: #1c1010; border: 1px solid #7f1d1d; border-radius: 8px; padding: 0.75rem 1rem; color: #fca5a5; font-size: 0.875rem; margin-bottom: 1rem; line-height: 1.5; }
        .download-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
        .btn-download-png { background: #0ea5e9; }
        .btn-download-png:hover:not(:disabled) { background: #0284c7; }
        .btn-download-svg { background: #8b5cf6; }
        .btn-download-svg:hover:not(:disabled) { background: #7c3aed; }
        .btn-download-drawio { background: #f97316; }
        .btn-download-drawio:hover:not(:disabled) { background: #ea580c; }
        .btn-open-drawio { background: #f97316; display: flex; align-items: center; gap: 0.4rem; }
        .btn-open-drawio:hover:not(:disabled) { background: #ea580c; }
        .drawio-hint { margin-top: 0.6rem; background: #1a1a2e; border: 1px solid #f97316; border-radius: 6px; padding: 0.6rem 0.9rem; font-size: 0.78rem; color: #fdba74; line-height: 1.6; }
        .drawio-hint strong { color: #fb923c; }
        .gen-explanation { margin-top: 1rem; border: 1px solid #1e3a5f; border-radius: 8px; overflow: hidden; }
        .gen-explanation > summary { list-style: none; cursor: pointer; background: #0f172a; padding: 0.6rem 1rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #60a5fa; user-select: none; display: flex; align-items: center; gap: 0.5rem; }
        .gen-explanation > summary::before { content: '\25B6'; font-size: 0.6rem; transition: transform 0.2s; }
        .gen-explanation[open] > summary::before { transform: rotate(90deg); }
        .gen-explanation-body { padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 1rem; background: #0d1b2a; }
        .gen-section-label { font-size: 0.68rem; color: #475569; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.4rem; }
        .entity-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .entity-chip { background: #1e3a5f; color: #93c5fd; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 12px; border: 1px solid #2d5a8e; font-weight: 500; }
        .rel-list { display: flex; flex-direction: column; gap: 0.35rem; }
        .rel-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
        .rel-node { color: #e2e8f0; font-weight: 500; }
        .rel-arrow { color: #475569; font-size: 0.75rem; }
        .rel-type-badge { background: #1e293b; color: #64748b; font-size: 0.68rem; padding: 0.1rem 0.45rem; border-radius: 3px; border: 1px solid #334155; margin-left: 0.25rem; }
        .reasoning-text { font-size: 0.82rem; color: #94a3b8; line-height: 1.55; }
        .generation-mode { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.75rem; font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 4px; }
        .generation-mode.llm { background: #14532d44; color: #4ade80; border: 1px solid #166534; }
        .generation-mode.rule { background: #1e3a5f44; color: #93c5fd; border: 1px solid #1e40af; }
        .mode-indicator { margin-top: 0.5rem; font-size: 0.8rem; color: #64748b; }
        .mode-indicator .badge-auto { color: #94a3b8; font-weight: 600; }
        .mode-indicator .badge-manual { color: #60a5fa; font-weight: 600; }
        .classification-info { display: flex; flex-wrap: wrap; gap: 1.25rem; padding: 0.75rem 1rem; background: #0f172a; border-radius: 8px; margin-bottom: 1rem; }
        .class-item { display: flex; flex-direction: column; gap: 0.2rem; min-width: 80px; }
        .class-label { font-size: 0.68rem; color: #475569; text-transform: uppercase; letter-spacing: 0.07em; }
        .class-value { font-size: 0.85rem; color: #e2e8f0; font-weight: 500; }
        .class-confidence { display: flex; align-items: center; gap: 0.5rem; }
        .conf-bar { width: 72px; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
        .conf-fill { height: 100%; border-radius: 2px; background: #3b82f6; }
        .conf-fill.high { background: #22c55e; }
        .conf-fill.med  { background: #f59e0b; }
        .conf-fill.low  { background: #ef4444; }
        .class-mode-badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 4px; }
        .class-mode-badge.llm      { background: #14532d44; color: #4ade80; border: 1px solid #166534; }
        .class-mode-badge.rule     { background: #1e3a5f44; color: #93c5fd; border: 1px solid #1e40af; }
        .class-mode-badge.fallback { background: #431407aa; color: #fdba74; border: 1px solid #c2410c; }
        .fallback-notice { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 1rem; background: #431407; border: 1px solid #c2410c; border-radius: 8px; padding: 0.7rem 1rem; font-size: 0.82rem; color: #fed7aa; line-height: 1.5; }
        .fallback-notice-icon { font-size: 1rem; flex-shrink: 0; line-height: 1.4; }
        .divider { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; color: #475569; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #334155; }
        .pdf-section { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; padding: 1rem; background: #1e293b; border-radius: 8px; border: 1px dashed #334155; flex-wrap: wrap; }
        .pdf-filename { flex: 1; font-size: 0.85rem; color: #64748b; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        input[type="file"] { display: none; }
        .btn-choose-file { background: #334155; }
        .btn-choose-file:hover:not(:disabled) { background: #475569; }
        .btn-pdf { background: #7c3aed; }
        .btn-pdf:hover:not(:disabled) { background: #6d28d9; }
        .pdf-preview { margin-top: 1rem; padding: 0.75rem 1rem; background: #0f172a; border-radius: 8px; border-left: 3px solid #7c3aed; }
        .pdf-preview-label { font-size: 0.72rem; color: #7c3aed; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.4rem; }
        .pdf-preview-text { font-size: 0.8rem; color: #64748b; line-height: 1.6; word-break: break-word; }
        .pdf-preview-toggle { margin-top: 0.5rem; background: none; border: none; padding: 0; font-size: 0.75rem; color: #7c3aed; font-weight: 600; cursor: pointer; text-decoration: underline; opacity: 0.85; }
        .pdf-preview-toggle:hover { opacity: 1; }
        .demo-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .demo-bar label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0; white-space: nowrap; }
        .demo-select { background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 0.55rem 0.75rem; font-size: 0.88rem; flex: 1; cursor: pointer; }
        .demo-select:focus { outline: none; border-color: #3b82f6; }
        .demo-badge { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.2rem 0.55rem; border-radius: 4px; background: #1e3a5f; color: #60a5fa; border: 1px solid #1e40af; white-space: nowrap; }
        .top-nav { position: sticky; top: 0; z-index: 10; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #1e293b; backdrop-filter: blur(10px); }
        .top-nav-inner { max-width: 1120px; margin: 0 auto; padding: 0.85rem 1.5rem; display: flex; align-items: center; gap: 1rem; justify-content: space-between; }
        .brand { font-weight: 800; color: #f8fafc; letter-spacing: 0; }
        .nav-links { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
        .nav-button { background: transparent; border: 1px solid transparent; padding: 0.45rem 0.7rem; color: #94a3b8; }
        .nav-button:hover:not(:disabled), .nav-button.active { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .nav-user { color: #cbd5e1; font-size: 0.84rem; margin-left: 0.35rem; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover:not(:disabled) { background: #475569; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }
        .btn-success { background: #16a34a; }
        .btn-success:hover:not(:disabled) { background: #15803d; }
        .app-shell { max-width: 1120px; margin: 0 auto; padding: 2rem 1.5rem; }
        .app-shell .app { max-width: 960px; padding: 0; }
        .auth-layout { min-height: calc(100vh - 76px); display: grid; place-items: start center; padding-top: 3rem; }
        .auth-card, .panel { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.35rem; }
        .auth-card { max-width: 440px; }
        .auth-card h1, .panel h1 { font-size: 1.45rem; margin-bottom: 0.4rem; }
        .form-grid { display: grid; gap: 0.9rem; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 0.68rem 0.75rem; font-size: 0.9rem; }
        input:focus { outline: none; border-color: #3b82f6; }
        .field-error { color: #fca5a5; font-size: 0.76rem; margin-top: 0.3rem; }
        .muted { color: #94a3b8; font-size: 0.88rem; line-height: 1.5; }
        .stack { display: flex; flex-direction: column; gap: 1rem; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .toolbar-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
        .project-card, .diagram-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
        .project-card h3, .diagram-card h3 { font-size: 1rem; color: #f8fafc; overflow-wrap: anywhere; }
        .card-meta { display: flex; flex-wrap: wrap; gap: 0.45rem; color: #94a3b8; font-size: 0.78rem; }
        .card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: auto; }
        .empty-state { border: 1px dashed #334155; border-radius: 8px; padding: 2rem; text-align: center; background: #111827; }
        .notice { border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.86rem; margin-bottom: 1rem; }
        .notice.success { background: #052e1a; border: 1px solid #166534; color: #86efac; }
        .notice.error { background: #1c1010; border: 1px solid #7f1d1d; color: #fca5a5; }
        .notice.info { background: #0f2544; border: 1px solid #1d4ed8; color: #bfdbfe; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(2, 6, 23, 0.76); display: grid; place-items: center; padding: 1rem; }
        .modal { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 1.25rem; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .modal-header { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 1rem; }
        .modal-close { background: transparent; border: 1px solid #475569; padding: 0.35rem 0.6rem; }
        .split-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 1rem; align-items: start; }
        .diagram-list { display: grid; gap: 0.85rem; }
        .source-panel { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 1rem; overflow: auto; max-height: 440px; }
        .source-panel pre { white-space: pre-wrap; word-break: break-word; color: #cbd5e1; font-family: 'SF Mono', Monaco, monospace; font-size: 0.82rem; line-height: 1.55; }
        .editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr); gap: 1rem; align-items: start; }
        .editor-textarea { min-height: 430px; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.82rem; line-height: 1.55; white-space: pre; overflow: auto; tab-size: 4; resize: vertical; }
        .prompt-textarea { min-height: 90px; }
        .editor-status { min-height: 1.35rem; color: #94a3b8; font-size: 0.82rem; }
        .dirty-badge { background: #713f12; border: 1px solid #a16207; color: #fde68a; border-radius: 999px; padding: 0.2rem 0.55rem; font-size: 0.72rem; font-weight: 700; }
        .preview-panel { min-height: 430px; background: #fff; border-radius: 8px; border: 1px solid #334155; padding: 1rem; display: flex; align-items: center; justify-content: center; overflow: auto; }
        .preview-panel img { max-width: 100%; height: auto; }
        .preview-empty { color: #64748b; text-align: center; line-height: 1.5; }
        .history-list { display: grid; gap: 0.6rem; }
        .history-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.8rem; display: grid; gap: 0.55rem; }
        .history-item.current { border-color: #16a34a; }
        .history-topline { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
        .history-version { color: #f8fafc; font-weight: 800; }
        .history-meta { color: #94a3b8; font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .version-code { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 1rem; white-space: pre-wrap; overflow: auto; max-height: 320px; color: #cbd5e1; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.82rem; line-height: 1.55; }
        .details-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; }
        .detail-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem; }
        .detail-label { display: block; color: #64748b; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.25rem; }
        .detail-value { color: #e2e8f0; font-size: 0.88rem; overflow-wrap: anywhere; }
        .save-panel { margin-top: 1rem; border-top: 1px solid #334155; padding-top: 1rem; }
        .inline-form { display: grid; gap: 0.75rem; margin-top: 0.75rem; }
        .loading-line { color: #94a3b8; padding: 1rem 0; }
        .link-button { background: transparent; border: none; padding: 0; color: #60a5fa; text-decoration: underline; }
        .link-button:hover:not(:disabled) { background: transparent; color: #93c5fd; }
        button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
        @media (max-width: 760px) {
            .top-nav-inner { align-items: flex-start; flex-direction: column; }
            .nav-links { width: 100%; }
            .app-shell { padding: 1.25rem 1rem; }
            .row, .toolbar, .download-actions { align-items: stretch; flex-direction: column; }
            .row > *, .toolbar-actions button, .download-actions button { width: 100%; }
            .split-grid { grid-template-columns: 1fr; }
            .editor-layout { grid-template-columns: 1fr; }
            .editor-textarea, .preview-panel { min-height: 320px; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useRef, useCallback } = React;

        mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

        function MermaidDiagram({ code }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (!containerRef.current || !code) return;
                const id = 'mermaid-' + Math.random().toString(36).slice(2, 10);
                mermaid.render(id, code)
                    .then(({ svg }) => {
                        if (containerRef.current) containerRef.current.innerHTML = svg;
                    })
                    .catch(() => {
                        if (containerRef.current) {
                            containerRef.current.innerHTML =
                                '<pre style="color:#f87171;font-size:0.8rem;white-space:pre-wrap">' +
                                code.replace(/</g, '&lt;') + '</pre>';
                        }
                    });
            }, [code]);
            return <div ref={containerRef} style={{width:'100%'}} />;
        }

        function ResultMetadata({ result }) {

        const AuthApi = (() => {
            let csrf = null;
            const mutationMethods = new Set(['POST', 'PUT', 'PATCH', 'DELETE']);

            async function parseResponse(res) {
                if (res.status === 204) return null;
                const contentType = res.headers.get('content-type') || '';
                if (contentType.includes('application/json')) return await res.json();
                const text = await res.text();
                return text ? { message: text } : null;
            }

            async function parseErrorResponse(res) {
                const contentType = res.headers.get('content-type') || '';
                if (contentType.includes('application/json')) return await res.json();
                const text = await res.text();
                return text ? { message: text } : null;
            }

            function buildError(res, body) {
                const err = new Error((body && body.message) || (res.status === 401 ? 'Authentication required' : `HTTP ${res.status}`));
                err.status = res.status;
                err.code = body && body.code;
                err.body = body;
                return err;
            }

            async function fetchCsrfToken() {
                const res = await fetch('/api/auth/csrf', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: { Accept: 'application/json' },
                });
                if (!res.ok) throw buildError(res, await parseResponse(res));
                csrf = await res.json();
                return csrf;
            }

            async function apiFetch(url, options = {}) {
                const method = (options.method || 'GET').toUpperCase();
                const headers = new Headers(options.headers || {});
                headers.set('Accept', 'application/json');
                let body = options.body;
                const isJsonBody = body && !(body instanceof FormData) && typeof body !== 'string';
                if (isJsonBody) {
                    headers.set('Content-Type', 'application/json');
                    body = JSON.stringify(body);
                } else if (typeof body === 'string' && !headers.has('Content-Type')) {
                    headers.set('Content-Type', 'application/json');
                }
                if (mutationMethods.has(method)) {
                    if (!csrf || !csrf.headerName || !csrf.token) await fetchCsrfToken();
                    headers.set(csrf.headerName, csrf.token);
                }
                const res = await fetch(url, { ...options, method, body, headers, credentials: 'same-origin' });
                const data = await parseResponse(res);
                if (!res.ok) throw buildError(res, data);
                return data;
            }

            async function apiFetchBlob(url, options = {}) {
                const method = (options.method || 'GET').toUpperCase();
                const headers = new Headers(options.headers || {});
                headers.set('Accept', options.accept || 'image/svg+xml');
                let body = options.body;
                const isJsonBody = body && !(body instanceof FormData) && typeof body !== 'string';
                if (isJsonBody) {
                    headers.set('Content-Type', 'application/json');
                    body = JSON.stringify(body);
                }
                if (mutationMethods.has(method)) {
                    if (!csrf || !csrf.headerName || !csrf.token) await fetchCsrfToken();
                    headers.set(csrf.headerName, csrf.token);
                }
                const res = await fetch(url, { ...options, method, body, headers, credentials: 'same-origin' });
                if (!res.ok) throw buildError(res, await parseErrorResponse(res));
                return await res.blob();
            }

            async function refreshCsrfToken() {
                csrf = null;
                return fetchCsrfToken();
            }

            return {
                fetchCsrfToken,
                refreshCsrfToken,
                apiFetch,
                apiFetchBlob,
                registerUser: data => apiFetch('/api/auth/register', { method: 'POST', body: data }),
                loginUser: data => apiFetch('/api/auth/login', { method: 'POST', body: data }),
                logoutUser: () => apiFetch('/api/auth/logout', { method: 'POST' }),
                getCurrentUser: () => apiFetch('/api/auth/me'),
                listProjects: () => apiFetch('/api/projects'),
                createProject: data => apiFetch('/api/projects', { method: 'POST', body: data }),
                getProject: id => apiFetch(`/api/projects/${id}`),
                updateProject: (id, data) => apiFetch(`/api/projects/${id}`, { method: 'PUT', body: data }),
                deleteProject: id => apiFetch(`/api/projects/${id}`, { method: 'DELETE' }),
                listProjectDiagrams: id => apiFetch(`/api/projects/${id}/diagrams`),
                saveDiagram: (projectId, data) => apiFetch(`/api/projects/${projectId}/diagrams`, { method: 'POST', body: data }),
                attachDiagram: (projectId, diagramId, data) => apiFetch(`/api/projects/${projectId}/diagrams/${diagramId}/attach`, { method: 'POST', body: data }),
                getDiagram: id => apiFetch(`/api/workspace/diagrams/${id}`),
                updateDiagramMetadata: (id, data) => apiFetch(`/api/workspace/diagrams/${id}/metadata`, { method: 'PUT', body: data }),
                deleteDiagram: id => apiFetch(`/api/workspace/diagrams/${id}`, { method: 'DELETE' }),
                previewDiagram: sourceCode => apiFetchBlob('/api/workspace/preview', { method: 'POST', body: { sourceCode, outputFormat: 'SVG' }, accept: 'image/svg+xml' }),
                listVersions: id => apiFetch(`/api/workspace/diagrams/${id}/versions`),
                createVersion: (id, data) => apiFetch(`/api/workspace/diagrams/${id}/versions`, { method: 'POST', body: data }),
                getVersion: (id, versionNumber) => apiFetch(`/api/workspace/diagrams/${id}/versions/${versionNumber}`),
                restoreVersion: (id, versionNumber) => apiFetch(`/api/workspace/diagrams/${id}/versions/${versionNumber}/restore`, { method: 'POST' }),
            };
        })();

        function formatDate(value) {
            if (!value) return 'Not available';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Not available';
            return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(date);
        }

            const raw = window.location.hash.replace(/^#\/?/, '');
            const parts = raw.split('/').filter(Boolean);
            if (parts[0] === 'login') return { name: 'login' };
            if (parts[0] === 'register') return { name: 'register' };
            if (parts[0] === 'dashboard') return { name: 'dashboard' };
            if (parts[0] === 'projects' && parts[1]) return { name: 'project', projectId: parts[1] };
            if (parts[0] === 'diagrams' && parts[1]) return { name: 'diagram', diagramId: parts[1], projectId: parts[2] || null };
            return { name: 'generate' };
        }

            const [submitting, setSubmitting] = useState(false);
            const [formError, setFormError] = useState(null);

            async function submit(e) {
                e.preventDefault();
                const nextErrors = {};
                if (!name.trim()) nextErrors.name = 'Project name is required.';
                if (name.length > 120) nextErrors.name = 'Project name is too long.';
                if (description.length > 500) nextErrors.description = 'Description is too long.';
                setErrors(nextErrors);
                if (Object.keys(nextErrors).length) return;
                setSubmitting(true);
                setFormError(null);
                try {
                    await onSubmit({ name: name.trim(), description: description.trim() });
                } catch (e) {
                    setFormError(e.message || 'Project could not be saved.');
                } finally {
                    setSubmitting(false);
                }
            }

            return (
                <form className="form-grid" onSubmit={submit}>

                    setError('Email and password are required.');
                    return;

                setLoading(true);
                try {
                    const user = await AuthApi.loginUser({ email: email.trim(), password });
                    setPassword('');
                    await AuthApi.refreshCsrfToken();
                    onLogin(user, 'Welcome back.');
                    go('dashboard');
                } catch (e) {
                    setError(e.status === 401 ? 'Invalid email or password.' : (e.message || 'Login failed.'));
                } finally {
                    setLoading(false);
                }

            return (
                <div className="auth-layout">
                    <form className="auth-card form-grid" onSubmit={submit}>
                        <div>
                            <h1>Log in</h1>

        function RegisterView({ onLogin, go }) {
            const [form, setForm] = useState({ firstName: '', lastName: '', email: '', password: '', confirmPassword: '' });
            const [errors, setErrors] = useState({});
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);

            function setField(field, value) {
                setForm(prev => ({ ...prev, [field]: value }));
                setErrors(prev => ({ ...prev, [field]: null }));
            }

            async function submit(e) {
                e.preventDefault();
                const next = {};
                if (!form.firstName.trim()) next.firstName = 'First name is required.';
                if (!form.lastName.trim()) next.lastName = 'Last name is required.';
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) next.email = 'Use a valid email address.';
                if (form.password.length < 8) next.password = 'Password must be at least 8 characters.';
                if (form.password !== form.confirmPassword) next.confirmPassword = 'Passwords must match.';
                setErrors(next);
                setError(null);
                if (Object.keys(next).length) return;
                setLoading(true);
                try {
                    const user = await AuthApi.registerUser({
                        firstName: form.firstName.trim(),
                        lastName: form.lastName.trim(),
                        email: form.email.trim(),
                        password: form.password,
                    });
                    setForm({ firstName: '', lastName: '', email: '', password: '', confirmPassword: '' });
                    await AuthApi.refreshCsrfToken();
                    onLogin(user, 'Account created.');
                    go('dashboard');
                } catch (e) {
                    setError(e.code === 'DUPLICATE_EMAIL' ? 'That email is already registered.' : (e.message || 'Registration failed.'));
                } finally {
                    setLoading(false);
                }
            }

            return (
                <div className="auth-layout">
                    <form className="auth-card form-grid" onSubmit={submit}>
                        <div>
                            <h1>Create account</h1>
                            <p className="muted">Save diagrams into projects and return to them later.</p>
                        </div>
                        {error && <div className="notice error">{error}</div>}
                        <div>
                            <label htmlFor="first-name">First name</label>
                            <input id="first-name" type="text" value={form.firstName} onChange={e => setField('firstName', e.target.value)} required />
                            {errors.firstName && <div className="field-error">{errors.firstName}</div>}
                        </div>
                        <div>
                            <label htmlFor="last-name">Last name</label>
                            <input id="last-name" type="text" value={form.lastName} onChange={e => setField('lastName', e.target.value)} required />
                            {errors.lastName && <div className="field-error">{errors.lastName}</div>}
                        </div>
                        <div>
                            <label htmlFor="register-email">Email</label>
                            <input id="register-email" type="email" value={form.email} onChange={e => setField('email', e.target.value)} autoComplete="email" required />
                            {errors.email && <div className="field-error">{errors.email}</div>}
                        </div>
                        <div>
                            <label htmlFor="register-password">Password</label>
                            <input id="register-password" type="password" value={form.password} onChange={e => setField('password', e.target.value)} autoComplete="new-password" required />
                            {errors.password && <div className="field-error">{errors.password}</div>}
                        </div>
                        <div>
                            <label htmlFor="confirm-password">Confirm password</label>
                            <input id="confirm-password" type="password" value={form.confirmPassword} onChange={e => setField('confirmPassword', e.target.value)} autoComplete="new-password" required />
                            {errors.confirmPassword && <div className="field-error">{errors.confirmPassword}</div>}
                        </div>
                        <button type="submit" disabled={loading}>{loading ? 'Creating account...' : 'Create account'}</button>
                        <p className="muted">Already have an account? <button type="button" className="link-button" onClick={() => go('login')}>Log in</button></p>
                    </form>
                </div>
            );
        }
