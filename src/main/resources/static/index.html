        function DiagramEditorView({ diagramId, projectId, go, notify, loadProjects, setNavigationGuard }) {
            const [diagram, setDiagram] = useState(null);
            const [versions, setVersions] = useState([]);
            const [editorSource, setEditorSource] = useState('');
            const [originalSource, setOriginalSource] = useState('');
            const [editorPrompt, setEditorPrompt] = useState('');
            const [originalPrompt, setOriginalPrompt] = useState('');
            const [previewUrl, setPreviewUrl] = useState(null);
            const [previewStatus, setPreviewStatus] = useState('idle');
            const [previewMessage, setPreviewMessage] = useState('');
            const [saveStatus, setSaveStatus] = useState('idle');
            const [saveMessage, setSaveMessage] = useState('');
            const [selectedVersion, setSelectedVersion] = useState(null);
            const [selectedVersionLoading, setSelectedVersionLoading] = useState(false);
            const [editingMetadata, setEditingMetadata] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(false);
            const [restoreTarget, setRestoreTarget] = useState(null);
            const [restoreLoading, setRestoreLoading] = useState(false);
            const previewUrlRef = useRef(null);
            const previewRequestRef = useRef(0);

            const isPlantUml = diagram?.sourceFormat === 'PLANTUML';
            const dirty = editorSource !== originalSource || editorPrompt !== originalPrompt;

            function discardMessage() {
                return 'You have unsaved changes. Continue and discard them?';
            }

            function confirmDiscardIfDirty() {
                return !dirty || window.confirm(discardMessage());
            }

            function revokePreviewUrl() {
                if (previewUrlRef.current) {
                    URL.revokeObjectURL(previewUrlRef.current);
                    previewUrlRef.current = null;
                }
            }

            async function refresh() {
                setLoading(true);
                setError(null);
                try {
                    const loaded = await AuthApi.getDiagram(diagramId);
                    setDiagram(loaded);
                    const source = loaded.currentSourceCode || '';
                    const prompt = loaded.originalPrompt || '';
                    setEditorSource(source);
                    setOriginalSource(source);
                    setEditorPrompt(prompt);
                    setOriginalPrompt(prompt);
                    await refreshVersions();
                } catch (e) {
                    setError(e.message || 'Diagram could not be loaded.');
                } finally {
                    setLoading(false);
                }
            }

            async function refreshVersions() {
                setVersions(await AuthApi.listVersions(diagramId));
            }

            useEffect(() => { refresh(); }, [diagramId]);

            useEffect(() => {
                setNavigationGuard(() => dirty);
                return () => setNavigationGuard(null);
            }, [dirty, setNavigationGuard]);

            useEffect(() => {
                function beforeUnload(e) {
                    if (!dirty) return;
                    e.preventDefault();
                    e.returnValue = '';
                }
                window.addEventListener('beforeunload', beforeUnload);
                return () => window.removeEventListener('beforeunload', beforeUnload);
            }, [dirty]);

            useEffect(() => {
                if (!isPlantUml) {
                    setPreviewStatus('unsupported');
                    setPreviewMessage('Live preview is available for PlantUML diagrams only.');
                    return;
                }
                if (!editorSource.trim()) {
                    revokePreviewUrl();
                    setPreviewUrl(null);
                    setPreviewStatus('idle');
                    setPreviewMessage('Enter PlantUML source to preview.');
                    return;
                }
                setPreviewStatus(previewUrl ? 'stale' : 'rendering');
                setPreviewMessage(previewUrl ? 'Source changed. Refreshing preview...' : 'Rendering preview...');
                const timer = window.setTimeout(() => renderPreview(editorSource), 650);
                return () => window.clearTimeout(timer);
            }, [editorSource, isPlantUml]);

            useEffect(() => () => revokePreviewUrl(), []);

            async function renderPreview(source = editorSource) {
                if (!isPlantUml || !source.trim()) return;
                const requestId = previewRequestRef.current + 1;
                previewRequestRef.current = requestId;
                setPreviewStatus('rendering');
                setPreviewMessage('Rendering preview...');
                try {
                    const blob = await AuthApi.previewDiagram(source);
                    if (requestId !== previewRequestRef.current) return;
                    const nextUrl = URL.createObjectURL(blob);
                    revokePreviewUrl();
                    previewUrlRef.current = nextUrl;
                    setPreviewUrl(nextUrl);
                    setPreviewStatus('ready');
                    setPreviewMessage('Preview updated.');
                } catch (e) {
                    if (requestId !== previewRequestRef.current) return;
                    setPreviewStatus('error');
                    setPreviewMessage(e.status === 401 ? 'Your session expired. Log in again to preview.' : (e.message || 'Preview could not be rendered.'));
                }
            }

            async function deleteDiagram() {
                if (!confirmDiscardIfDirty()) return;
                try {
                    await AuthApi.deleteDiagram(diagramId);
                    revokePreviewUrl();
                    await loadProjects(true);
                    notify('success', 'Diagram deleted.');
                    go(projectId ? 'project' : 'dashboard', projectId ? { projectId } : {});
                } catch (e) {
                    notify('error', e.status === 404 ? 'Diagram was already unavailable.' : (e.message || 'Diagram could not be deleted.'));
                }
            }

            async function saveVersion() {
                if (!isPlantUml) return;
                if (!editorSource.trim()) {
                    setSaveStatus('error');
                    setSaveMessage('Source code is required.');
                    return;
                }
                setSaveStatus('saving');
                setSaveMessage('');
                try {
                    const saved = await AuthApi.createVersion(diagramId, {
                        prompt: editorPrompt,
                        sourceCode: editorSource,
                        sourceFormat: 'PLANTUML',
                        changeType: 'EDITED',
                        modelUsed: 'manual-editor',
                    });
                    if (!saved) {
                        setSaveStatus('idle');
                        setSaveMessage('No changes to save.');
                        return;
                    }
                    const updatedDiagram = await AuthApi.getDiagram(diagramId);
                    setDiagram(updatedDiagram);
                    setOriginalSource(editorSource);
                    setOriginalPrompt(editorPrompt);
                    await refreshVersions();
                    setSaveStatus('saved');
                    setSaveMessage(`Saved version ${saved.versionNumber}.`);
                    notify('success', `Saved version ${saved.versionNumber}.`);
                } catch (e) {
                    setSaveStatus('error');
                    setSaveMessage(e.status === 409 ? 'Version could not be saved. Refresh and try again.' : (e.message || 'Version could not be saved.'));
                }
            }

            function resetChanges() {
                if (!dirty || window.confirm('Reset unsaved source and prompt changes?')) {
                    setEditorSource(originalSource);
                    setEditorPrompt(originalPrompt);
                    setSaveMessage('');
                }
            }

            function handleSourceKeyDown(e) {
                if (e.key !== 'Tab') return;
                e.preventDefault();
                const el = e.currentTarget;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                const next = editorSource.slice(0, start) + '    ' + editorSource.slice(end);
                setEditorSource(next);
                window.requestAnimationFrame(() => {
                    el.selectionStart = el.selectionEnd = start + 4;
                });
            }

            async function openVersion(versionNumber) {
                setSelectedVersionLoading(true);
                try {
                    setSelectedVersion(await AuthApi.getVersion(diagramId, versionNumber));
                } catch (e) {
                    notify('error', e.message || 'Version could not be loaded.');
                } finally {
                    setSelectedVersionLoading(false);
                }
            }

            function loadVersionIntoEditor(version) {
                if (!confirmDiscardIfDirty()) return;
                setEditorSource(version.sourceCode || '');
                setEditorPrompt(version.prompt || '');
                setSelectedVersion(null);
                notify('info', 'Version loaded into editor. Save to create new version.');
            }

            async function restoreVersion(versionNumber) {
                if (!confirmDiscardIfDirty()) return;
                setRestoreLoading(true);
                try {
                    const restored = await AuthApi.restoreVersion(diagramId, versionNumber);
                    const updatedDiagram = await AuthApi.getDiagram(diagramId);
                    const source = updatedDiagram.currentSourceCode || '';
                    const prompt = updatedDiagram.originalPrompt || '';
                    setDiagram(updatedDiagram);
                    setEditorSource(source);
                    setOriginalSource(source);
                    setEditorPrompt(prompt);
                    setOriginalPrompt(prompt);
                    await refreshVersions();
                    setSelectedVersion(null);
                    setRestoreTarget(null);
                    notify('success', `Restored as version ${restored.versionNumber}.`);
                } catch (e) {
                    notify('error', e.message || 'Version could not be restored.');
                } finally {
                    setRestoreLoading(false);
                }
            }

            async function updateMetadata(data) {
                try {
                    const updated = await AuthApi.updateDiagramMetadata(diagramId, data);
                    setDiagram(updated);
                    setEditingMetadata(false);
                    await loadProjects(true);
                    notify('success', 'Diagram metadata updated.');
                } catch (e) {
                    notify('error', e.message || 'Metadata could not be updated.');
                }
            }

            function backToProject() {
                go(diagram?.projectId ? 'project' : 'dashboard', diagram?.projectId ? { projectId: diagram.projectId } : {});
            }

            if (loading && !diagram) return <div className="loading-line">Loading diagram...</div>;
            if (error) return <div className="notice error">{error} <button className="link-button" onClick={refresh}>Retry</button></div>;
            if (!diagram) return null;

            return (
                <div className="stack">
                    <button className="btn-secondary" onClick={backToProject}>
                        Back to project
                    </button>
                    <div className="toolbar">
                        <div>
                            <h1>{diagram.name} {dirty && <span className="dirty-badge">Unsaved</span>}</h1>
                            <p className="subtitle">{diagram.description || 'No description'}</p>
                        </div>
                        <div className="toolbar-actions">
                            <button className="btn-secondary" onClick={() => setEditingMetadata(true)}>Edit Metadata</button>
                            <button className="btn-danger" onClick={() => setConfirmDelete(true)}>Delete Diagram</button>
                        </div>
                    </div>
                    <section className="panel stack">
                        <div className="details-list">
                            <div className="detail-item"><span className="detail-label">Type</span><span className="detail-value">{diagram.diagramType}</span></div>
                            <div className="detail-item"><span className="detail-label">Format</span><span className="detail-value">{diagram.sourceFormat}</span></div>
                            <div className="detail-item"><span className="detail-label">Version</span><span className="detail-value">v{diagram.currentVersionNumber}</span></div>
                            <div className="detail-item"><span className="detail-label">Model</span><span className="detail-value">{diagram.modelUsed || 'No model'}</span></div>
                            <div className="detail-item"><span className="detail-label">Created</span><span className="detail-value">{formatDate(diagram.createdAt)}</span></div>
                            <div className="detail-item"><span className="detail-label">Updated</span><span className="detail-value">{formatDate(diagram.updatedAt)}</span></div>
                        </div>
                    </section>
                    {!isPlantUml && (
                        <div className="notice info">Editing and live preview are currently available for PlantUML diagrams only. This diagram remains read-only.</div>
                    )}
                    {isPlantUml ? (
                        <div className="editor-layout">
                            <section className="panel stack">
                                <div>
                                    <label htmlFor="version-prompt">Version prompt</label>
                                    <textarea id="version-prompt" className="prompt-textarea" value={editorPrompt} onChange={e => setEditorPrompt(e.target.value)} spellCheck="false" />
                                </div>
                                <div>
                                    <label htmlFor="source-editor">PlantUML source</label>
                                    <textarea id="source-editor" className="editor-textarea" value={editorSource} onChange={e => setEditorSource(e.target.value)} onKeyDown={handleSourceKeyDown} spellCheck="false" />
                                </div>
                                <div className="toolbar-actions">
                                    <button className="btn-success" onClick={saveVersion} disabled={saveStatus === 'saving' || !editorSource.trim()}>{saveStatus === 'saving' ? 'Saving...' : 'Save Version'}</button>
                                    <button className="btn-secondary" onClick={resetChanges} disabled={!dirty || saveStatus === 'saving'}>Reset Changes</button>
                                    <button className="btn-secondary" onClick={() => renderPreview(editorSource)} disabled={previewStatus === 'rendering'}>{previewStatus === 'rendering' ? 'Rendering...' : 'Refresh Preview'}</button>
                                </div>
                                <div className="editor-status" aria-live="polite">{saveMessage}</div>
                            </section>
                            <section className="panel stack">
                                <div className="toolbar" style={{marginBottom: 0}}>
                                    <h2>Live preview</h2>
                                    <span className={`badge ${previewStatus === 'error' ? 'error' : ''}`}>{previewStatus}</span>
                                </div>
                                <div className="preview-panel" aria-live="polite">
                                    {previewUrl ? <img src={previewUrl} alt="Rendered PlantUML preview" /> : <div className="preview-empty">Preview will appear here.</div>}
                                </div>
                                {previewMessage && <div className={previewStatus === 'error' ? 'notice error' : 'editor-status'}>{previewMessage}</div>}
                            </section>
                        </div>
                    ) : (
                        <section className="panel stack">
                            <h2>Current source</h2>
                            <div className="source-panel">
                                <pre>{diagram.currentSourceCode || 'No source code stored.'}</pre>
                            </div>
                        </section>
                    )}
                    <section className="panel stack">
                        <div className="toolbar" style={{marginBottom: 0}}>
                            <h2>Version History</h2>
                            <button className="btn-secondary" onClick={refreshVersions}>Refresh</button>
                        </div>
                        {versions.length === 0 ? <p className="muted">No versions saved yet.</p> : (
                            <div className="history-list">
                                {versions.map(version => (
                                    <article key={version.versionNumber} className={`history-item ${version.versionNumber === diagram.currentVersionNumber ? 'current' : ''}`}>
                                        <div className="history-topline">
                                            <span className="history-version">Version {version.versionNumber}</span>
                                            {version.versionNumber === diagram.currentVersionNumber && <span className="dirty-badge">Current</span>}
                                        </div>
                                        <div className="history-meta">
                                            <span>{version.changeType}</span>
                                            <span>{version.sourceFormat}</span>
                                            <span>{version.modelUsed || 'No model'}</span>
                                            <span>{formatDate(version.createdAt)}</span>
                                        </div>
                                        <div className="toolbar-actions">
                                            <button className="btn-secondary" onClick={() => openVersion(version.versionNumber)} disabled={selectedVersionLoading}>View</button>
                                            {version.versionNumber !== diagram.currentVersionNumber && <button onClick={() => setRestoreTarget(version)}>Restore</button>}
                                        </div>
                                    </article>
                                ))}
                            </div>
                        )}
                    </section>
                    {editingMetadata && (
                        <Modal title="Edit diagram metadata" onClose={() => setEditingMetadata(false)}>
                            <ProjectForm initialProject={diagram} submitLabel="Save Metadata" onSubmit={updateMetadata} onCancel={() => setEditingMetadata(false)} />
                        </Modal>
                    )}
                    {selectedVersion && (
                        <Modal title={`Version ${selectedVersion.versionNumber}`} onClose={() => setSelectedVersion(null)}>
                            <div className="stack">
                                <div className="details-list">
                                    <div className="detail-item"><span className="detail-label">Change</span><span className="detail-value">{selectedVersion.changeType}</span></div>
                                    <div className="detail-item"><span className="detail-label">Format</span><span className="detail-value">{selectedVersion.sourceFormat}</span></div>
                                    <div className="detail-item"><span className="detail-label">Model</span><span className="detail-value">{selectedVersion.modelUsed || 'No model'}</span></div>
                                    <div className="detail-item"><span className="detail-label">Created</span><span className="detail-value">{formatDate(selectedVersion.createdAt)}</span></div>
                                </div>
                                <div>
                                    <span className="detail-label">Prompt</span>
                                    <p className="muted">{selectedVersion.prompt || 'No prompt stored.'}</p>
                                </div>
                                <div>
                                    <span className="detail-label">Source code</span>
                                    <pre className="version-code">{selectedVersion.sourceCode}</pre>
                                </div>
                                <div className="toolbar-actions">
                                    {selectedVersion.sourceFormat === 'PLANTUML' && <button onClick={() => loadVersionIntoEditor(selectedVersion)}>Load into Editor</button>}
                                    {selectedVersion.versionNumber !== diagram.currentVersionNumber && <button className="btn-secondary" onClick={() => setRestoreTarget(selectedVersion)}>Restore This Version</button>}
                                    <button className="btn-secondary" onClick={() => setSelectedVersion(null)}>Close</button>
                                </div>
                            </div>
                        </Modal>
                    )}
                    {restoreTarget && (
                        <Modal title={`Restore version ${restoreTarget.versionNumber}`} onClose={() => setRestoreTarget(null)}>
                            <div className="stack">
                                <p className="muted">Restore does not delete newer versions. It creates a new version from this historical source.</p>
                                <div className="toolbar-actions">
                                    <button onClick={() => restoreVersion(restoreTarget.versionNumber)} disabled={restoreLoading}>{restoreLoading ? 'Restoring...' : 'Restore Version'}</button>
                                    <button className="btn-secondary" onClick={() => setRestoreTarget(null)} disabled={restoreLoading}>Cancel</button>
                                </div>
                            </div>
                        </Modal>
                    )}
                    {confirmDelete && (
                        <Modal title="Delete diagram" onClose={() => setConfirmDelete(false)}>
                            <div className="stack">
                                <p className="muted">Delete "{diagram.name}"?</p>
                                <div className="toolbar-actions">
                                    <button className="btn-danger" onClick={deleteDiagram}>Delete Diagram</button>
                                    <button className="btn-secondary" onClick={() => setConfirmDelete(false)}>Cancel</button>
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        function SaveDiagramDialog({ result, originalPrompt, fallbackType, projects, loadProjects, onClose, onSaved, go, notify }) {
            const [projectId, setProjectId] = useState(projects[0]?.id || '');
            const [name, setName] = useState(result?.name || `${result?.diagramType || fallbackType || 'Generated'} diagram`);
            const [description, setDescription] = useState('');
            const [newProjectName, setNewProjectName] = useState('');
            const [newProjectDescription, setNewProjectDescription] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                loadProjects(false).then(list => {
                    if (!projectId && list && list[0]) setProjectId(list[0].id);
                }).catch(e => setError(e.message || 'Projects could not be loaded.'));
            }, []);

            async function createProjectInline() {
                if (!newProjectName.trim()) {
                    setError('New project name is required.');
                    return;
                }
                setLoading(true);
                setError(null);
                try {
                    const project = await AuthApi.createProject({ name: newProjectName.trim(), description: newProjectDescription.trim() });
                    const list = await loadProjects(true);
                    setProjectId(project.id);
                    setNewProjectName('');
                    setNewProjectDescription('');
                    notify('success', 'Project created.');
                } catch (e) {
                    setError(e.message || 'Project could not be created.');
                } finally {
                    setLoading(false);
                }
            }

            async function save(e) {
                e.preventDefault();
                if (!projectId) {
                    setError('Choose or create a project.');
                    return;
                }
                if (!name.trim()) {
                    setError('Diagram name is required.');
                    return;
                }
                if (result.mermaidCode && !result.plantUmlCode) {
                    setError('Workspace saving currently supports PlantUML only.');
                    return;
                }
                setLoading(true);
                setError(null);
                try {
                    let saved;
                    if (result.id) {
                        saved = await AuthApi.attachDiagram(projectId, result.id, { name: name.trim(), description: description.trim() });
                    } else {
                        saved = await AuthApi.saveDiagram(projectId, {
                            name: name.trim(),
                            description: description.trim(),
                            originalPrompt: originalPrompt || '',
                            diagramType: mapTypeToEnum(result.diagramType || fallbackType || 'CLASS'),
                            sourceFormat: 'PLANTUML',
                            sourceCode: result.plantUmlCode,
                            modelUsed: result.modelUsed || result.generationMode || 'frontend',
                        });
                    }
                    await loadProjects(true);
                    onSaved(saved);
                } catch (e) {
                    setError(e.message || 'Diagram could not be saved.');
                } finally {
                    setLoading(false);
                }
            }

            return (
                <Modal title="Save diagram to project" onClose={onClose}>
                    <form className="form-grid" onSubmit={save}>
                        {error && <div className="notice error">{error}</div>}
                        {result.mermaidCode && !result.plantUmlCode && (
                            <div className="notice info">Workspace saving currently supports PlantUML only.</div>
                        )}
                        <div>
                            <label htmlFor="save-project">Project</label>
                            <select id="save-project" value={projectId} onChange={e => setProjectId(e.target.value)}>
                                <option value="">Choose project</option>
                                {projects.map(project => <option key={project.id} value={project.id}>{project.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label htmlFor="diagram-name">Diagram name</label>
                            <input id="diagram-name" type="text" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div>
                            <label htmlFor="diagram-description">Description</label>
                            <textarea id="diagram-description" value={description} onChange={e => setDescription(e.target.value)} style={{height: '80px'}} />
                        </div>
                        <div className="toolbar-actions">
                            <button type="submit" disabled={loading || (result.mermaidCode && !result.plantUmlCode)}>{loading ? 'Saving...' : 'Save Diagram'}</button>
                            <button type="button" className="btn-secondary" onClick={onClose} disabled={loading}>Cancel</button>
                        </div>
                    </form>
                    <div className="save-panel">
                        <h3>Create project during save</h3>
                        <div className="inline-form">
                            <div>
                                <label htmlFor="inline-project-name">Project name</label>
                                <input id="inline-project-name" type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} />
                            </div>
                            <div>
                                <label htmlFor="inline-project-description">Description</label>
                                <input id="inline-project-description" type="text" value={newProjectDescription} onChange={e => setNewProjectDescription(e.target.value)} />
                            </div>
                            <button type="button" className="btn-secondary" onClick={createProjectInline} disabled={loading}>Create and Select Project</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        function cleanPdfText(raw) {
            if (!raw) return '';
            return raw
                .replace(/\r\n|\r/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{2,}/g, '\n\n')
                .replace(/([^\n])\n([^\n])/g, '$1 $2')
                .trim();
        }

        function mapTypeToEnum(displayType) {
            const mapping = {
                'Class Diagram': 'CLASS',
                'Sequence Diagram': 'SEQUENCE',
                'ER Diagram': 'ER',
                'Entity Relationship Diagram': 'ER',
                'Component Diagram': 'COMPONENT',
                'Deployment Diagram': 'DEPLOYMENT',
                'Use Case Diagram': 'USE_CASE',
                'Object Diagram': 'OBJECT',
                'Activity Diagram': 'ACTIVITY',
                'State Diagram': 'STATE',
                'Collaboration Diagram': 'COLLABORATION',
                'Microservices Architecture': 'MICROSERVICES_ARCHITECTURE',
                'Microservices Diagram': 'MICROSERVICES_ARCHITECTURE',
            };
            if (!displayType) return 'CLASS';
            return mapping[displayType] || String(displayType).toUpperCase().replace(/\s+/g, '_').replace('_DIAGRAM', '');
        }

        function GeneratorView({ currentUser, projects, loadProjects, go, notify }) {
            const [text, setText] = useState('A user logs in through an auth service that queries a database');
            const [diagramType, setDiagramType] = useState('');
            const [selectedDemo, setSelectedDemo] = useState('');
            const [result, setResult] = useState(null);
            const [suggestion, setSuggestion] = useState(null);
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);
            const [pdfFile, setPdfFile] = useState(null);
            const [pdfLoading, setPdfLoading] = useState(false);
            const [showFullPdfText, setShowFullPdfText] = useState(false);
            const [saveOpen, setSaveOpen] = useState(false);
            const [savedDiagram, setSavedDiagram] = useState(null);
            const pdfInputRef = useRef(null);

            async function handleGenerate(overrideType = null, forceGenerate = false) {
                setError(null);
                setResult(null);
                setSuggestion(null);
                setSavedDiagram(null);
                const resolvedType = overrideType || diagramType || null;
                if (!text || !text.trim()) {
                    if (!resolvedType) {
                        setError('Please enter a description.');
                        return;
                    }
                }
                const isManual = !!resolvedType;
                setLoading(true);
                try {
                    const body = { text: text || '' };
                    if (resolvedType) body.diagramType = resolvedType;
                    if (forceGenerate) body.forceGenerate = true;
                    const res = await fetch('/api/diagram/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const envelope = await res.json();
                    const data = envelope.data || envelope;
                    if (!res.ok && res.status !== 422) throw new Error(data.message || envelope.message || 'HTTP ' + res.status);
                    if (isManual) {
                        setResult(data);
                        return;
                    }
                    if (data.decision === 'SUGGEST') {
                        setSuggestion({ message: data.message, diagramType: data.diagramType, confidenceScore: data.confidenceScore ?? 0 });
                        return;
                    }
                    if (data.decision === 'REJECT') {
                        setError(data.message || 'Please provide a more detailed description so the system can identify the diagram type.');
                        return;
                    }
                    setResult(data);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            }

            function handleProceed() {
                if (suggestion?.diagramType) handleGenerate(mapTypeToEnum(suggestion.diagramType), true);
            }

            async function downloadDiagram(format) {
                try {
                    const res = await fetch(`/api/diagram/${result.id}/${format}`);
                    if (!res.ok) throw new Error(`Download failed (${format.toUpperCase()}): HTTP ${res.status}`);
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `diagram-${result.id}.${format === 'drawio' ? 'drawio' : format}`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    setError(e.message);
                }
            }

            function handleKeyDown(e) {
                if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') handleGenerate();
            }

            function handleDemoSelect(e) {
                const val = e.target.value;
                setSelectedDemo(val);
                if (!val) return;
                const example = DEMO_EXAMPLES.find(ex => ex.value === val);
                if (!example) return;
                setText(example.text);
                setDiagramType(example.type);
                setResult(null);
                setSuggestion(null);
                setError(null);
                setSavedDiagram(null);
            }

            async function handlePdfUpload() {
                if (!pdfFile) return;
                setError(null);
                setResult(null);
                setSuggestion(null);
                setSavedDiagram(null);
                setPdfLoading(true);
                try {
                    const formData = new FormData();
                    formData.append('file', pdfFile);
                    const res = await fetch('/api/diagrams/from-pdf', { method: 'POST', body: formData });
                    const envelope = await res.json();
                    const data = envelope.data || envelope;
                    if (!res.ok) throw new Error(data.message || envelope.message || 'HTTP ' + res.status);
                    if (data.id) data.diagramImageUrl = `/api/diagrams/${data.id}/png`;
                    if (data.confidenceScore == null) data.confidenceScore = 100;
                    if (!data.modelUsed) data.modelUsed = 'Rule-Based';
                    if (!data.generationMode) data.generationMode = 'RULE_BASED';
                    setResult(data);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setPdfLoading(false);
                }
            }

            function canSave(result) {
                return currentUser && result && (result.plantUmlCode || result.id) && !(result.mermaidCode && !result.plantUmlCode);
            }

            return (
                <div className="app">
                    <h1>AI Diagram Generator</h1>
                    <p className="subtitle">Describe your system and get a UML diagram instantly</p>
                    <div className="form">
                        <div className="demo-bar">
                            <span className="demo-badge">Demo Examples</span>
                            <select className="demo-select" value={selectedDemo} onChange={handleDemoSelect}>
                                {DEMO_EXAMPLES.map(ex => <option key={ex.value} value={ex.value}>{ex.label}</option>)}
                            </select>
                        </div>
                        <div>
                            <label htmlFor="diagram-description-input">Description</label>
                            <textarea id="diagram-description-input" value={text} onChange={e => { setText(e.target.value); if (suggestion) setSuggestion(null); }} onKeyDown={handleKeyDown} placeholder="Describe your system, e.g. 'A user authenticates via an API that queries a database'" />
                        </div>
                        <div className="row">
                            <div>
                                <label htmlFor="diagram-type-select">Diagram Type</label>
                                <select id="diagram-type-select" value={diagramType} onChange={e => setDiagramType(e.target.value)}>
                                    {DIAGRAM_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                                </select>
                                <div className="mode-indicator">
                                    {diagramType ? <span>Mode: <span className="badge-manual">Manual ({DIAGRAM_TYPES.find(t => t.value === diagramType)?.label})</span></span> : <span>Mode: <span className="badge-auto">Auto-detect</span></span>}
                                </div>
                            </div>
                            <button onClick={() => handleGenerate()} disabled={loading}>
                                {loading && <span className="spinner" />}
                                {loading ? 'Generating...' : diagramType ? `Generate ${DIAGRAM_TYPES.find(t => t.value === diagramType)?.label ?? diagramType}` : 'Generate'}
                            </button>
                        </div>
                    </div>
                    <div className="divider">or upload a PDF</div>
                    <div className="pdf-section">
                        <input ref={pdfInputRef} type="file" accept=".pdf" onChange={e => setPdfFile(e.target.files[0] || null)} />
                        <button className="btn-choose-file" onClick={() => pdfInputRef.current.click()} disabled={pdfLoading}>Choose PDF</button>
                        <span className="pdf-filename">{pdfFile ? pdfFile.name : 'No file chosen'}</span>
                        <button className="btn-pdf" onClick={handlePdfUpload} disabled={pdfLoading || !pdfFile}>
                            {pdfLoading && <span className="spinner" />}
                            {pdfLoading ? 'Generating...' : 'Generate from PDF'}
                        </button>
                    </div>
                    {error && <div className="error">{error}</div>}
                    {suggestion && (
                        <div className="suggestion">
                            <div className="suggestion-header">Classification Suggestion</div>
                            <div className="suggestion-meta">
                                <span className="suggestion-type">{suggestion.diagramType}</span>
                                <span className="suggestion-confidence">Confidence: {suggestion.confidenceScore}%</span>
                            </div>
                            {(() => {
                                const s = suggestion.confidenceScore;
                                const tier = s >= 70 ? 'high' : s >= 40 ? 'med' : 'low';
                                return <div className="suggestion-conf-bar"><div className="suggestion-conf-track"><div className={`suggestion-conf-fill ${tier}`} style={{width: s + '%'}} /></div><span className="suggestion-conf-label">{s}%</span></div>;
                            })()}
                            <p className="suggestion-message">{suggestion.message || <>Your description appears to describe a <strong>{suggestion.diagramType}</strong>. Do you want to proceed?</>}</p>
                            <div className="suggestion-actions">
                                <button className="btn-proceed" onClick={handleProceed} disabled={loading}>{loading ? 'Generating...' : 'Proceed'}</button>
                                <button className="btn-dismiss" onClick={() => setSuggestion(null)} disabled={loading}>Cancel</button>
                            </div>
                        </div>
                    )}
                    {result && (
                        <div className="result">
                            <div className="result-header">
                                <h2>Result</h2>
                                <span className="badge">{result.diagramType}</span>
                            </div>
                            <ResultMetadata result={result} />
                            {result.generationMode === 'TEMPLATE_FALLBACK' && <div className="fallback-notice"><span className="fallback-notice-icon">&#x26A0;&#xFE0F;</span><span>{result.message || 'Diagram generation failed. Showing a default template instead.'}</span></div>}
                            <div className="diagram-container">
                                {result.svgContent ? <div dangerouslySetInnerHTML={{ __html: result.svgContent }} />
                                    : result.pngBase64 ? <img src={`data:image/png;base64,${result.pngBase64}`} alt="Generated diagram" />
                                    : result.mermaidCode ? <MermaidDiagram code={result.mermaidCode} />
                                    : result.diagramImageUrl ? <img src={result.diagramImageUrl} alt="Generated diagram" style={{maxWidth: '100%'}} />
                                    : <p style={{color: '#64748b'}}>Diagram rendering unavailable - see PlantUML code below.</p>}
                            </div>
                            {result.id && (
                                <div className="download-actions">
                                    <button className="btn-download-png" onClick={() => downloadDiagram('png')}>Download PNG</button>
                                    <button className="btn-download-svg" onClick={() => downloadDiagram('svg')}>Download SVG</button>
                                    <button className="btn-download-drawio" onClick={() => downloadDiagram('drawio')}>Download Draw.io XML</button>
                                </div>
                            )}
                            {currentUser && result.mermaidCode && !result.plantUmlCode && <div className="notice info save-panel">Workspace saving currently supports PlantUML only.</div>}
                            {canSave(result) && (
                                <div className="save-panel toolbar-actions">
                                    <button className="btn-success" onClick={() => setSaveOpen(true)}>Save to Project</button>
                                    {savedDiagram && (
                                        <>
                                            <button className="btn-secondary" onClick={() => go('project', { projectId: savedDiagram.projectId })}>Open Project</button>
                                            <button className="btn-secondary" onClick={() => go('diagram', { diagramId: savedDiagram.id, projectId: savedDiagram.projectId })}>Open Diagram</button>
                                        </>
                                    )}
                                </div>
                            )}
                            {!currentUser && <div className="notice info save-panel">Log in to save generated PlantUML diagrams into projects.</div>}
                            {result.message && <p className="explanation">{result.message}</p>}
                            {result.extractedTextPreview && (() => {
                                const PREVIEW_LIMIT = 400;
                                const cleaned = cleanPdfText(result.extractedTextPreview);
                                const isTruncated = cleaned.length > PREVIEW_LIMIT;
                                const displayed = showFullPdfText || !isTruncated ? cleaned : cleaned.slice(0, PREVIEW_LIMIT).replace(/\s+\S*$/, '') + '...';
                                return <div className="pdf-preview"><div className="pdf-preview-label">Extracted from PDF:</div><div className="pdf-preview-text">{displayed}</div>{isTruncated && <button className="pdf-preview-toggle" onClick={() => setShowFullPdfText(v => !v)}>{showFullPdfText ? 'Show less' : 'Show full extracted text'}</button>}</div>;
                            })()}
                            {result.explanation && (
                                <details className="gen-explanation">
                                    <summary>How this diagram was generated</summary>
                                    <div className="gen-explanation-body">
                                        {result.explanation.extractedEntities?.length > 0 && <div><div className="gen-section-label">Extracted entities</div><div className="entity-chips">{result.explanation.extractedEntities.map((e, i) => <span key={i} className="entity-chip">{e}</span>)}</div></div>}
                                        {result.explanation.detectedRelationships?.length > 0 && <div><div className="gen-section-label">Detected relationships</div><div className="rel-list">{result.explanation.detectedRelationships.map((r, i) => <div key={i} className="rel-item"><span className="rel-node">{r.source}</span><span className="rel-arrow">&#x2192;</span><span className="rel-node">{r.target}</span>{r.type && <span className="rel-type-badge">{r.type}</span>}</div>)}</div></div>}
                                        {result.explanation.typeReasoning && <div><div className="gen-section-label">Diagram type reasoning</div><p className="reasoning-text">{result.explanation.typeReasoning}</p></div>}
                                    </div>
                                </details>
                            )}
                            {result.plantUmlCode && (
                                <div className="code-block">
                                    {!result.svgContent && !result.pngBase64 && !result.diagramImageUrl && <div className="render-error"><strong>Rendering failed.</strong> The diagram could not be rendered as an image. The raw PlantUML code is shown below.</div>}
                                    <div className="code-block-label">PlantUML code</div>
                                    <pre>{result.plantUmlCode}</pre>
                                </div>
                            )}
                        </div>
                    )}
                    {saveOpen && (
                        <SaveDiagramDialog
                            result={result}
                            originalPrompt={text}
                            fallbackType={diagramType}
                            projects={projects}
                            loadProjects={loadProjects}
                            go={go}
                            notify={notify}
                            onClose={() => setSaveOpen(false)}
                            onSaved={diagram => {
                                setSavedDiagram(diagram);
                                setSaveOpen(false);
                                notify('success', result.id ? 'Diagram attached to project.' : 'Diagram saved to project.');
                            }}
                        />
                    )}
                    <div className="links">
                        <a href="/swagger-ui.html">Swagger UI</a>
                        <a href="/api-docs">OpenAPI Spec</a>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [authStatus, setAuthStatus] = useState('loading');
            const [currentView, setCurrentView] = useState(viewFromHash());
            const [projects, setProjects] = useState([]);
            const [notice, setNotice] = useState(null);
            const navigationGuardRef = useRef(null);

            function notify(type, message) {
                setNotice({ type, message });
            }

            function hasPendingNavigationGuard() {
                const guardDirty = navigationGuardRef.current && navigationGuardRef.current();
                const visibleEditorDirty = Boolean(document.querySelector('h1 .dirty-badge'));
                return guardDirty || visibleEditorDirty;
            }

            function go(name, params = {}) {
                if (hasPendingNavigationGuard()) {
                    if (!window.confirm('You have unsaved changes. Continue and discard them?')) return;
                }
                window.location.hash = hashFor(name, params);
                setCurrentView(viewFromHash());
            }

            const setNavigationGuard = useCallback((guard) => {
                navigationGuardRef.current = guard;
            }, []);

            function clearWorkspace() {
                setProjects([]);
            }

            async function handleSessionExpired(message = 'Your session expired. Please log in again.') {
                setCurrentUser(null);
                setAuthStatus('unauthenticated');
                clearWorkspace();
                notify('error', message);
                go('login');
                try { await AuthApi.refreshCsrfToken(); } catch (_) {}
            }

            async function loadProjects(force = false) {
                if (!currentUser) return [];
                if (!force && projects.length > 0) return projects;
                try {
                    const list = await AuthApi.listProjects();
                    setProjects(list || []);
                    return list || [];
                } catch (e) {
                    if (e.status === 401) await handleSessionExpired();
                    throw e;
                }
            }

            useEffect(() => {
                function onHash() { setCurrentView(viewFromHash()); }
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, []);

            useEffect(() => {
                async function restoreSession() {
                    try {
                        await AuthApi.fetchCsrfToken();
                        const user = await AuthApi.getCurrentUser();
                        setCurrentUser(user);
                        setAuthStatus('authenticated');
                        if (['login', 'register'].includes(viewFromHash().name)) go('dashboard');
                    } catch (e) {
                        setCurrentUser(null);
                        setAuthStatus('unauthenticated');
                        if (e.status !== 401) notify('error', e.message || 'Could not initialize session.');
                    }
                }
                restoreSession();
            }, []);

            async function logout() {
                if (hasPendingNavigationGuard()) {
                    if (!window.confirm('You have unsaved changes. Continue and discard them?')) return;
                }
                try {
                    await AuthApi.logoutUser();
                } catch (e) {
                    if (e.status !== 401 && e.status !== 403) notify('error', e.message || 'Logout failed.');
                } finally {
                    setCurrentUser(null);
                    setAuthStatus('unauthenticated');
                    clearWorkspace();
                    go('generate');
                    try { await AuthApi.refreshCsrfToken(); } catch (_) {}
                    notify('success', 'Logged out.');
                }
            }

            function requireAuth(view) {
                if (authStatus === 'loading') return <div className="loading-line">Restoring session...</div>;
                if (!currentUser) return <LoginView onLogin={(user, message) => { setCurrentUser(user); setAuthStatus('authenticated'); notify('success', message); }} go={go} />;
                return view;
            }

            let content;
            if (currentView.name === 'login') {
                content = <LoginView onLogin={(user, message) => { setCurrentUser(user); setAuthStatus('authenticated'); notify('success', message); }} go={go} />;
            } else if (currentView.name === 'register') {
                content = <RegisterView onLogin={(user, message) => { setCurrentUser(user); setAuthStatus('authenticated'); notify('success', message); }} go={go} />;
            } else if (currentView.name === 'dashboard') {
                content = requireAuth(<DashboardView projects={projects} loadProjects={loadProjects} go={go} notify={notify} />);
            } else if (currentView.name === 'project') {
                content = requireAuth(<ProjectDetailsView projectId={currentView.projectId} go={go} notify={notify} loadProjects={loadProjects} />);
            } else if (currentView.name === 'diagram') {
                content = requireAuth(<DiagramEditorView diagramId={currentView.diagramId} projectId={currentView.projectId} go={go} notify={notify} loadProjects={loadProjects} setNavigationGuard={setNavigationGuard} />);
            } else {
                content = <GeneratorView currentUser={currentUser} projects={projects} loadProjects={loadProjects} go={go} notify={notify} />;
            }

            return (
                <>
                    <nav className="top-nav">
                        <div className="top-nav-inner">
                            <div className="brand">AI Diagram Generator</div>
                            <div className="nav-links" aria-label="Primary navigation">
                                <button className={`nav-button ${currentView.name === 'generate' ? 'active' : ''}`} onClick={() => go('generate')}>Generate</button>
                                {currentUser ? (
                                    <>
                                        <button className={`nav-button ${currentView.name === 'dashboard' ? 'active' : ''}`} onClick={() => go('dashboard')}>Dashboard</button>
                                        <span className="nav-user">{userLabel(currentUser)}</span>
                                        <button className="nav-button" onClick={logout}>Logout</button>
                                    </>
                                ) : (
                                    <>
                                        <button className={`nav-button ${currentView.name === 'login' ? 'active' : ''}`} onClick={() => go('login')}>Login</button>
                                        <button className={`nav-button ${currentView.name === 'register' ? 'active' : ''}`} onClick={() => go('register')}>Register</button>
                                    </>
                                )}
                            </div>
                        </div>
                    </nav>
                    <main className="app-shell">
                        <Notice notice={notice} onClear={() => setNotice(null)} />
                        {content}
                    </main>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
