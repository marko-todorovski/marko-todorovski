# Postgres integration-test profile: verifies the postgresql/ Flyway migrations and the
# ck_diagram_shares_status / ck_repositories_source_type CHECK constraints against a REAL
# PostgreSQL instance (not H2), in an isolated schema so it never touches app data.
#
# Requires a local PostgreSQL 16 instance reachable at localhost:5432 (matches
# docker-compose.yml's db service: user ai_user, db ai_diagrams). Tests using this profile
# skip themselves (Assumptions.assumeTrue) if the connection is unavailable, so a normal
# `mvn test` run elsewhere is unaffected.

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_diagrams?currentSchema=repro_it_schema
spring.datasource.username=${PG_IT_USERNAME:ai_user}
spring.datasource.password=${PG_IT_PASSWORD:devpass}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.schemas=repro_it_schema
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=repro_it_schema
spring.jpa.show-sql=true

app.ai.assistant.mock-enabled=true
